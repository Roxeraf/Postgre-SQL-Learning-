services:
  db:
    image: postgres:16
    container_name: learnsql_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: learnsql
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/ensure-learnsql.sh:/ensure-learnsql.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "sh /ensure-learnsql.sh"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./app
    container_name: learnsql_app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: learnsql
      DB_USER: lernuser
      DB_PASSWORD: lernuser
      DB_ADMIN_USER: postgres
      DB_ADMIN_PASSWORD: postgres
      SQL_INIT_PATH: /app/db/01_schema_and_data.sql
      WORKSHOP_DIR: /data/workshop
      FLASK_DEBUG: "1"
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
      - ./db/init/01_schema_and_data.sql:/app/db/01_schema_and_data.sql:ro
      - ./data/workshop:/data/workshop
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
